name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    uses: bertie-mc/bertie-ci/.github/workflows/build-mod.yml@v3.7.1

  unit-test:
    uses: bertie-mc/bertie-ci/.github/workflows/unit-test.yml@v3.7.1

  gametest:
    uses: bertie-mc/bertie-ci/.github/workflows/gametest.yml@v3.7.1

  client-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mod
        uses: actions/checkout@3d3c4e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup@v3.7.1

      - name: Download built mod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .bertie-ci/artifact

      - name: Prepare EMI and Slag integration instance
        uses: bertie-mc/bertie-ci/actions/prepare-mod-instance@v3.7.1
        with:
          artifact: .bertie-ci/artifact
          fixture: emi,slag-n-embers
          side: client
          output-dir: .bertie-ci/client

      - name: Verify client integrations
        uses: bertie-mc/bertie-ci/actions/client-test@v3.7.1
        with:
          instance: .bertie-ci/client/instance.json
          work-dir: .bertie-ci/client
          success-marker: Registered 148 carving recipes with EMI

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carving-client-logs-${{ github.run_id }}
          path: .bertie-ci/client/*.log
          if-no-files-found: ignore
